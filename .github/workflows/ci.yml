name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Install reference tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          pip install "shamir-mnemonic[cli]==0.3.0" pexpect
      - name: Interop with reference shamir and age
        run: python scripts/interop.py "bun src/cli/main.ts"
      - name: Reproducible build guard
        run: |
          bash scripts/build.sh out/a
          bash scripts/build.sh out/b
          diff out/a/SHA256SUMS out/b/SHA256SUMS
      - name: CLI tests against luthen.mjs under Bun
        run: LUTHEN_CLI="bun $PWD/out/a/luthen.mjs" bun test test/cli

  script:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22.23.4" }
          - { os: ubuntu-latest, node: "24.22.1" }
          # Node writes to pipes asynchronously on macOS, which the slow-reader `open -o -` test needs to bite.
          - { os: macos-latest, node: "24.22.1" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run build:js
      - name: CLI tests against luthen.mjs under Node
        run: LUTHEN_CLI="node $PWD/dist/luthen.mjs" bun test test/cli
      - if: runner.os == 'Linux'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install reference tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          pip install "shamir-mnemonic[cli]==0.3.0" pexpect
      - name: Interop with reference shamir and age
        if: runner.os == 'Linux'
        run: python scripts/interop.py "node dist/luthen.mjs"
