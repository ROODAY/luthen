name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Build
        run: bash scripts/build.sh dist
      - name: Reproducibility check
        run: |
          bash scripts/build.sh dist2
          diff dist/SHA256SUMS dist2/SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/luthen-*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --generate-notes
