<!doctype html>
<html lang="en">
<head>

<body>
<header class="masthead">
  <h1>Luthen</h1>
  <p class="tagline">Encrypt a file and split its key into shares.</p>
</header>
<main>
  <noscript><p class="warn">Luthen needs JavaScript to run. Everything stays in this page; nothing is sent anywhere.</p></noscript>
  <div class="tabs" role="tablist" aria-label="Mode">
    <button type="button" role="tab" id="tab-seal" aria-controls="seal" aria-selected="true">Seal</button>
    <button type="button" role="tab" id="tab-verify" aria-controls="verify" aria-selected="false" tabindex="-1">Verify</button>
    <button type="button" role="tab" id="tab-open" aria-controls="open" aria-selected="false" tabindex="-1">Open</button>
  </div>
  <section class="panel" id="seal" role="tabpanel" aria-labelledby="tab-seal"></section>
  <section class="panel" id="verify" role="tabpanel" aria-labelledby="tab-verify" hidden></section>
  <section class="panel" id="open" role="tabpanel" aria-labelledby="tab-open" hidden></section>
</main>
<footer class="footer">
  <p>Runs entirely in your browser. This page cannot make network requests.</p>
  <p><a href="https://github.com/ROODAY/luthen#web-app">About the web app</a> · Luthen <span id="version"></span></p>

  </details>
</footer>
